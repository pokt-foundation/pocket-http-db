name: Build and Push Docker Image to Google Artifact Registry

on:
  workflow_run:
    workflows: ["Build & Test"]
    branches: [master, staging, v2-staging]
    types:
      - completed

env:
  PROJECT_ID: portal-gb-prod
  REPOSITORY: pocket-http-db
  IMAGE: pocket-http-db
  REGISTRY: us-central1-docker.pkg.dev

jobs:
  login-build-push:
    name: Docker login, build, and push
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v0.6.0"
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"
          token_format: "access_token"

      - name: Login to GAR
        uses: docker/login-action@v2
        with:
          registry: "${{ env.REGISTRY }}"
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Tag
        uses: codfish/semantic-release-action@v2.2.0
        id: semantic
        with:
          branches: |
            [
              'master',
              {
                name: 'staging',
                prerelease: true,
                prereleaseId: 'rc'
              },
              {
                name: 'v2-staging',
                prerelease: true,
                prereleaseId: 'rc'
              }
            ]
          tag_format: "v${version}"
          additional_packages: |
            ['@semantic-release/commit-analyzer']
          plugins: |
            ['@semantic-release/commit-analyzer']

      - id: docker-push-tagged
        if: steps.semantic.outputs.new-release-published == 'true'
        name: Tag Docker image and push to Google Artifact Registry
        uses: docker/build-push-action@v2
        with:
          build-args: GITHUB_TOKEN=${{ secrets.GH_ACCESS_TOKEN }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ steps.semantic.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest
