version: "2"
overrides:
  go:
    rename:
      application_ids: "ApplicationIDs"
      chain_ids: "ChainIDs"
      account_ids: "AccountIDs"
      portal_application_ids: "PortalApplicationIDs"
      favorited_chain_ids: "FavoritedChainIDs"
      partner_chain_ids: "PartnerChainIDs"
      provider_user_ids: "ProviderUserIDs"
      url: "URL"
      urls: "URLs"
      evm_chain_id: "EVMChainID"
      aats: "AATs"
      covalent_api_key_free: "CovalentAPIKeyFree"
      covalent_api_key_paid: "CovalentAPIKeyPaid"
      aat_id: "AATID"
      icon_url: "IconURL"
      stripe_subscription_id: "StripeSubscriptionID"
      config_gateway: "GatewayConfig"

sql:
  - schema: "schema.sql"
    engine: "postgresql"
    queries: "query.sql"
    gen:
      go:
        package: "postgresdriver"
        sql_package: "pgx/v5"
        out: ".."
        emit_json_tags: true
        output_db_file_name: db.generated.go
        output_models_file_name: models.generated.go
        output_querier_file_name: querier.generated.go
        output_files_suffix: .generated
        overrides:
          - column: "chains.blockchain"
            go_type: "github.com/jackc/pgx/v5/pgtype.Text"
          - column: "chains.description"
            go_type: "github.com/jackc/pgx/v5/pgtype.Text"
          - column: "chains.enforce_result"
            go_type: "github.com/jackc/pgx/v5/pgtype.Text"
          - column: "chains.ticker"
            go_type: "github.com/jackc/pgx/v5/pgtype.Text"
          - column: "accounts.plan_type"
            go_type: "github.com/jackc/pgx/v5/pgtype.Text"
          - db_type: "environment"
            go_type: "github.com/jackc/pgx/v5/pgtype.Text"
          # Enum Overrides
          - db_type: "auth_provider"
            go_type: "github.com/pokt-foundation/portal-http-db/v2/types.AuthProvider"
          - db_type: "auth_type"
            go_type: "github.com/pokt-foundation/portal-http-db/v2/types.AuthType"
          - db_type: "chain_auth_type"
            go_type: "github.com/pokt-foundation/portal-http-db/v2/types.ChainAuthType"
          - db_type: "chain_check_type"
            go_type: "github.com/pokt-foundation/portal-http-db/v2/types.ChainCheckType"
          - db_type: "notification_event"
            go_type: "github.com/pokt-foundation/portal-http-db/v2/types.NotificationEvent"
          - db_type: "notification_type"
            go_type: "github.com/pokt-foundation/portal-http-db/v2/types.NotificationType"
          - db_type: "permissions"
            go_type: "github.com/pokt-foundation/portal-http-db/v2/types.Permissions"
          - db_type: "whitelist_type"
            go_type: "github.com/pokt-foundation/portal-http-db/v2/types.WhitelistType"
          - db_type: "account_users"
            go_type: "github.com/pokt-foundation/portal-http-db/v2/types.AccountUser"
          # ID type Overrides
          - column: "portal_applications.id"
            go_type: "github.com/pokt-foundation/portal-http-db/v2/types.PortalAppID"
          - column: "portal_application_aats.portal_application_id"
            go_type: "github.com/pokt-foundation/portal-http-db/v2/types.PortalAppID"
          - column: "portal_application_aats.id"
            go_type: "github.com/pokt-foundation/portal-http-db/v2/types.ProtocolAppID"
          - column: "portal_application_aats.public_key"
            go_type: "github.com/pokt-foundation/portal-http-db/v2/types.PortalAppPublicKey"
          - column: "gigastake_applications.id"
            go_type: "github.com/pokt-foundation/portal-http-db/v2/types.GigastakeAppID"
          - column: "gigastake_applications.protocol_id"
            go_type: "github.com/pokt-foundation/portal-http-db/v2/types.ProtocolID"
          - column: "gigastake_applications.aat_id"
            go_type: "github.com/pokt-foundation/portal-http-db/v2/types.ProtocolAppID"
          - column: "chains_gigastake_applications.chain_id"
            go_type: "github.com/pokt-foundation/portal-http-db/v2/types.RelayChainID"
          - column: "chains_gigastake_applications.gigastake_application_id"
            go_type: "github.com/pokt-foundation/portal-http-db/v2/types.GigastakeAppID"
          - column: "portal_application_aats.application_id"
            go_type: "github.com/pokt-foundation/portal-http-db/v2/types.ProtocolAppID"
          - column: "portal_application_settings.application_id"
            go_type: "github.com/pokt-foundation/portal-http-db/v2/types.PortalAppID"
          - column: "portal_application_whitelists.application_id"
            go_type: "github.com/pokt-foundation/portal-http-db/v2/types.PortalAppID"
          - column: "portal_applications.plan_type"
