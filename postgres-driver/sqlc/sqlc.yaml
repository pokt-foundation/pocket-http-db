          - column: "account_users.user_id"
            go_type: "github.com/pokt-foundation/portal-http-db/v2/types.UserID"
          - column: "account_users.role_name"
            go_type: "github.com/pokt-foundation/portal-http-db/v2/types.RoleName"
          - column: "account_users.account_id"
            go_type: "github.com/pokt-foundation/portal-http-db/v2/types.AccountID"
          - column: "account_users.user_id"
            go_type: "github.com/pokt-foundation/portal-http-db/v2/types.UserID"
          - column: "account_users.role_name"
            go_type: "github.com/pokt-foundation/portal-http-db/v2/types.RoleName"
          - column: "users.id"
