        - Chains
      summary: Get Chain by ID
      description: Returns detail of the chain identified by the given ID.
      operationId: getChainById
      responses:
        "200":
          description: Successful response with chain details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  blockchain:
                    type: string
                  scheme:
                    type: string
                    enum:
                      - "https"
                      - "wss"
                  description:
                    type: string
                  iconURL:
                    type: string
                  enforceResult:
                    type: string
                  path:
                    type: string
                  ticker:
                    type: string
                  allowedMethods:
                    type: array
                    items:
                      type: string
                  logLimitBlocks:
                    type: integer
                  requestTimeout:
                    type: integer
                  active:
                    type: boolean
                  altruists:
                    type: object
                  chainChecks:
                    type: object
                  chainAliases:
                    type: object
                  domains:
                    type: object
