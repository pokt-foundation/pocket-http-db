                  logLimitBlocks:
                    type: integer
                  requestTimeout:
                    type: integer
                  active:
                    type: boolean
                  altruists:
                    type: object
                  chainChecks:
                    type: object
                  chainAliases:
                    type: object
                  domains:
                    type: object
                  createdAt:
                    type: string
                  updatedAt:
                    type: string
                  deleted:
                    type: boolean
                  gigastakeAppsByProtocol:
                    type: object
              examples:
                example1:
                  value:
                    id: "0001"
                    blockchain: "mainnet"
                    scheme: "https"
                    description: "POKT Network Mainnet"
                    iconURL: ""
                    enforceResult: "REST"
                    path: "/v1/query/height"
                    ticker: "POKT"
                    allowedMethods: null
                    logLimitBlocks: 0
                    requestTimeout: 0
                    active: true
                    altruists:
                      "https://0001.altruist.test.tools:1234":
                        url: "https://0001.altruist.test.tools:1234"
