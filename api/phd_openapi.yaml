  /v2/chain/{chainID}/activate:
    parameters:
      - name: chainID
        in: path
        required: true
        schema:
          type: string
        description: Unique identifier of the chain
    put:
      tags:
        - Chains
      summary: Activate Chain
      description: Activate the chain identified by the given ID. Pass true to activate and false to deactivate.
      operationId: activateChain
      requestBody:
        content:
          application/json:
            examples:
              Activate Chain:
                value: "true"
      responses:
        "200":
          description: Successfully activated the chain.
          content:
            application/json:
              schema:
                type: boolean
              examples:
                successResponse:
                  value: true
  /v2/gigastake:
    get:
      tags:
        - Gigastake Apps
      summary: Get All Gigastake Apps
      description: Get All Gigastake Apps
      operationId: getAllGigastakeApps
      parameters:
        - name: include_deleted
          in: query
          schema:
            type: string
            example: "true"
      responses:
        "200":
          description: Successfully retrieved the gigastake apps details.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    protocolID:
                      type: string
                    chainIDs:
                      type: object
                      additionalProperties: {}
                    name:
                      type: string
                    address:
                      type: string
                    publicKey:
                      type: string
                    clientPublicKey:
                      type: string
                    signature:
                      type: string
                    version:
                      type: string
                    createdAt:
                      type: string
                      format: date-time
                    updatedAt:
                      type: string
                      format: date-time
                    deleted:
                      type: boolean
              examples:
                exampleResponse:
                  value:
                    - id: "1a2b3c4d"
                      protocolID: "morse-mainnet"
                      chainIDs:
                        "0009": {}
                      name: "clefable"
                      address: "test_e9f33cf0e807dc9ed9c2b9776b82e548"
                      publicKey: "test_e9f33cf0e807dc9ed9c2b9776b82e548"
                      clientPublicKey: "test_e9f33cf0e807dc9ed9c2b9776b82e548"
                      signature: "test_e9f33cf0e807dc9ed9c2b9776b82e548"
                      version: "0.0.1"
                      createdAt: "2023-07-26T03:02:30.217721Z"
                      updatedAt: "2024-02-08T22:12:50.894316Z"
                      deleted: false
  /v2/gigastake/{gigastakeID}:
    parameters:
      - name: gigastakeID
        in: path
        required: true
        schema:
          type: string
        description: Unique identifier of the gigastake app
    get:
      tags:
        - Gigastake Apps
      summary: Get Gigastake App By ID
      description: Returns a single gigastake app by its unique ID.
      operationId: getGigastakeAppById
      responses:
        "200":
          description: Successfully fetched the gigastake.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  protocolID:
                    type: string
                  chainIDs:
                    type: object
                    additionalProperties: {}
                  name:
                    type: string
                  address:
                    type: string
                  publicKey:
                    type: string
                  clientPublicKey:
                    type: string
                  signature:
                    type: string
                  version:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  deleted:
                    type: boolean
              examples:
                exampleResponse:
                  value:
