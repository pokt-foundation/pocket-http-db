                          version: "0.0.1"
                          createdAt: "2023-08-09T12:48:56.300505Z"
                          updatedAt: "2024-02-08T22:12:46.916389Z"
                          deleted: false
    put:
      tags:
        - Chains
      summary: Update Chain
      description: Update the chain identified by the given ID with new information.
      operationId: updateChain
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                blockchain:
                  type: string
                  example: pokt-testnet
                scheme:
                  type: string
                  enum:
                    - "https"
                    - "wss"
                  example: "https"
                description:
                  type: string
                  example: Pocket Network Testnet
                enforceResult:
                  type: string
                  example: JSON
                path:
                  type: string
                  example: /v1/query/test-height
                ticker:
                  type: string
                  example: POKT
                active:
                  type: boolean
                  example: true
                altruists:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      url:
                        type: string
                      authType:
                        type: string
                      auth:
                        type: string
                    required:
                      - url
                      - authType
                      - auth
                chainChecks:
                  type: object
                  properties:
                    sync:
                      type: object
                      properties:
                        type:
                          type: string
                          example: sync
                        payload:
                          type: string
                          example: '{"id":2,"jsonrpc":"2.0","method":"query_test"}'
                        resultKey:
                          type: string
                          example: result.sync_info_test
                        allowance:
                          type: number
                          example: 2
                domains:
                  type: object
                  additionalProperties:
                    type: array
                    items:
                      type: string
            examples:
              Update Chain:
                value:
                  blockchain: pokt-testnet
                  scheme: "https"
                  description: Pocket Network Testnet
                  enforceResult: JSON
                  path: /v1/query/test-height
                  ticker: POKT
                  active: true
                  altruists:
                    "https://altruist-0002.com:1234":
                      url: "https://altruist-0002.com:1234"
                      authType: basic_auth
                      auth: "test_pocket2:auth654321"
                  chainChecks:
                    sync:
                      type: sync
                      payload: '{"id":2,"jsonrpc":"2.0","method":"query_test"}'
                      resultKey: result.sync_info_test
                      allowance: 2
                  domains:
                    pokt-testnet: ["mainnet.rpc.grove.city"]
      responses:
        "200":
          description: Successful response with chain details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  blockchain:
                    type: string
                  scheme:
                    type: string
                    enum:
                      - "https"
                      - "wss"
                  description:
                    type: string
                  iconURL:
                    type: string
