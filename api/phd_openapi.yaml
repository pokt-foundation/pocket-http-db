openapi: 3.0.3
info:
  title: Portal HTTP Database
  description: The Portal HTTP Database (PHD) provides access to the Portal database through a REST API.
  version: 1.0.0
  contact:
    name: Pascal
    email: pascal@grove.city
servers:
  - url: https://phd.portal.grove.city
    description: Production PHD URL
  - url: https://phd.portal.grove.town
    description: Staging PHD URL
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
security:
  - ApiKeyAuth: []
paths:
  /v2/chain:
    get:
      tags:
        - Chains
      summary: Get All Chains
      description: Returns a list of all chain in the database.
      operationId: getAllChains
      parameters:
        - name: include_inactive
          in: query
          schema:
            type: string
            example: "true"
        - name: include_deleted
          in: query
          schema:
            type: string
            example: "true"
      responses:
        "200":
          description: A list of all chains.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    blockchain:
                      type: string
                    scheme:
                      type: string
                      enum:
                        - "https"
                        - "wss"
                    description:
                      type: string
                    iconURL:
                      type: string
                    enforceResult:
                      type: string
                    path:
                      type: string
                    ticker:
                      type: string
                    allowedMethods:
                      type: array
                      items:
                        type: string
                    logLimitBlocks:
                      type: integer
                    requestTimeout:
                      type: integer
                    active:
                      type: boolean
                    altruists:
                      type: object
                    chainChecks:
                      type: object
                    chainAliases:
                      type: object
                    domains:
                      type: object
                    createdAt:
                      type: string
                    updatedAt:
                      type: string
                    deleted:
                      type: boolean
                    gigastakeAppsByProtocol:
                      type: object
              examples:
                example1:
                  value:
                    - id: "0001"
                      blockchain: "mainnet"
                      scheme: "https"
                      description: "POKT Network Mainnet"
                      iconURL: ""
                      enforceResult: "REST"
                      path: "/v1/query/height"
                      ticker: "POKT"
                      allowedMethods: null
                      logLimitBlocks: 0
                      requestTimeout: 0
                      active: true
                      altruists:
                        "https://0001.altruist.test.tools:1234":
                          url: "https://0001.altruist.test.tools:1234"
                          auth: "user:password"
                          authType: "basic_auth"
                      chainChecks:
                        sync:
                          type: "sync"
                          payload: "{}"
                          resultKey: "height"
                          allowance: 1
                          evmChainID: 0
                      chainAliases:
                        mainnet: {}
                        pokt-rpc: {}
                      domains:
                        mainnet: ["mainnet.rpc.grove.city"]
                      createdAt: "2023-07-06T16:28:20.478504Z"
                      updatedAt: "2024-02-15T12:34:45.84326Z"
                      deleted: false
                      gigastakeAppsByProtocol:
                        morse-mainnet:
                          "1a2b3c4d":
                            id: "1a2b3c4d"
                            protocolID: "morse-mainnet"
                            chainIDs:
                              "0001": {}
                            name: "articuno"
                            address: "test_e9f33cf0e807dc9ed9c2b9776b82e548"
                            publicKey: "test_e9f33cf0e807dc9ed9c2b9776b82e548"
                            clientPublicKey: "test_e9f33cf0e807dc9ed9c2b9776b82e548"
                            signature: "test_e9f33cf0e807dc9ed9c2b9776b82e548"
                            version: "0.0.1"
                            createdAt: "2023-08-09T12:48:56.300505Z"
                            updatedAt: "2024-02-08T22:12:46.916389Z"
                            deleted: false
    post:
      tags:
        - Chains
        - Gigastake Apps
      summary: Create Chain and Gigastake Apps
      description: Creates a new chain along with associated Gigastake apps. If not creating Gigastake apps that do not exist in the database, the gigastakeApps array should be excluded. Existing Gigastake apps should be updated using the updateGigastakeApps endpoint.
      operationId: createChainAndGigastakeApps
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                chain:
                  type: object
                  properties:
                    active:
                      type: boolean
                      example: true
                    altruists:
                      type: object
                      properties:
                        https://altruist-0002.com:1234:
                          type: object
                          properties:
                            auth:
                              type: string
                              example: test_pocket2:auth654321
                            authType:
                              type: string
                              example: basic_auth
                            url:
                              type: string
                              example: https://altruist-0002.com:1234
                    blockchain:
                      type: string
                      example: mainnet
                    scheme:
                      type: string
                      enum:
                        - "https"
                        - "wss"
                    chainChecks:
                      type: object
                      properties:
                        chain:
                          type: object
                          properties:
                            evm_chain_id:
                              type: string
                              example: "021"
                            payload:
                              type: string
                              example: '{"method":"eth_chainId","id":1,"jsonrpc":"2.0"}'
                            resultKey:
                              type: string
                              example: id
                            type:
                              type: string
                              example: chain
                        sync:
                          type: object
                          properties:
                            allowance:
                              type: number
                              example: 2
                            payload:
                              type: string
                              example: '{"id":2,"jsonrpc":"2.0","method":"query_test"}'
                            resultKey:
                              type: string
                              example: result.sync_info_test
                            type:
                              type: string
                              example: sync
                    description:
                      type: string
                      example: Pocket Network
                    domains:
                      type: object
                      properties:
                        mainnet:
                          type: array
                          items:
                            type: string
                            example: mainnet.rpc.grove.city
                          example:
                            - mainnet.rpc.grove.city
                    enforceResult:
                      type: string
                      example: JSON
                    id:
                      type: string
                      example: "0001"
                    path:
                      type: string
                      example: /v1/query/test-height
                    ticker:
                      type: string
                      example: POKT
                gigastakeApps:
                  type: array
                  items:
                    type: object
                    properties:
                      address:
                        type: string
                        example: test_7d5f7a4a0c7d9f2cd11c2a563e7e8c6
                      clientPublicKey:
                        type: string
                        example: test_75d39g1dd93f419b91b528b1d0783a10
                      privateKey:
                        type: string
                        example: test_1b7gf3c98bf647eb94f2b00c9c1f2e94
                      protocolID:
                        type: string
                        example: morse-mainnet
                      publicKey:
                        type: string
                        example: test_47b1e9527g6049ec98b9b6b308efc3d1
                      signature:
                        type: string
                        example: test_g33762gb677457hcb41c716f6g57f4db
                      version:
                        type: string
                        example: 0.0.1
                  example:
                    - address: test_7d5f7a4a0c7d9f2cd11c2a563e7e8c6
                      clientPublicKey: test_75d39g1dd93f419b91b528b1d0783a10
                      privateKey: test_1b7gf3c98bf647eb94f2b00c9c1f2e94
                      protocolID: morse-mainnet
                      publicKey: test_47b1e9527g6049ec98b9b6b308efc3d1
                      signature: test_g33762gb677457hcb41c716f6g57f4db
                      version: 0.0.1
            examples:
              Create Chain and Gigastake Apps:
                value:
                  chain:
                    active: true
                    altruists:
                      https://altruist-0002.com:1234:
                        auth: test_pocket2:auth654321
                        authType: basic_auth
                        url: https://altruist-0002.com:1234
                    blockchain: mainnet
                    chainChecks:
                      chain:
                        evm_chain_id: "021"
                        payload: '{"method":"eth_chainId","id":1,"jsonrpc":"2.0"}'
                        resultKey: id
                        type: chain
                      sync:
                        allowance: 2
                        payload: '{"id":2,"jsonrpc":"2.0","method":"query_test"}'
                        resultKey: result.sync_info_test
                        type: sync
                    description: Pocket Network
                    domains:
                      mainnet:
                        - mainnet.rpc.grove.city
                    enforceResult: JSON
                    id: "0001"
                    path: /v1/query/test-height
                    ticker: POKT
                  gigastakeApps:
                    - address: test_7d5f7a4a0c7d9f2cd11c2a563e7e8c6
                      clientPublicKey: test_75d39g1dd93f419b91b528b1d0783a10
                      privateKey: test_1b7gf3c98bf647eb94f2b00c9c1f2e94
                      protocolID: morse-mainnet
                      publicKey: test_47b1e9527g6049ec98b9b6b308efc3d1
                      signature: test_g33762gb677457hcb41c716f6g57f4db
                      version: 0.0.1
      responses:
        "200":
          description: Chain and gigastakes created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  chain:
                    type: object
                    properties:
                      id:
                        type: string
                      blockchain:
                        type: string
                      scheme:
                        type: string
                        enum:
                          - "https"
                          - "wss"
                      description:
                        type: string
                      iconURL:
                        type: string
                      enforceResult:
                        type: string
                      path:
                        type: string
                      ticker:
                        type: string
                      allowedMethods:
                        type: array
                        items:
                          type: string
                      logLimitBlocks:
                        type: integer
                      requestTimeout:
                        type: integer
                      active:
                        type: boolean
                      altruists:
                        type: object
                      chainChecks:
                        type: object
                      domains:
                        type: object
                      createdAt:
                        type: string
                      updatedAt:
                        type: string
                      deleted:
                        type: boolean
                  gigastakeApps:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        protocolID:
                          type: string
                        chainIDs:
                          type: object
                        name:
                          type: string
                        address:
                          type: string
                        publicKey:
                          type: string
                        clientPublicKey:
                          type: string
                        signature:
                          type: string
                        version:
                          type: string
                        createdAt:
                          type: string
                        updatedAt:
                          type: string
                        deleted:
                          type: boolean
              examples:
                exampleResponse:
                  value:
                    chain:
                      id: "4444"
                      blockchain: "pokt-mainnet"
                      description: "Pocket Network"
                      iconURL: ""
                      enforceResult: "JSON"
                      path: "/v1/query/test-height"
                      ticker: "POKT"
                      allowedMethods: null
                      logLimitBlocks: 0
                      requestTimeout: 0
                      active: true
                      altruists:
                        "https://altruist-0002.com:1234":
                          url: "https://altruist-0002.com:1234"
                          auth: "test_pocket2:auth654321"
                          authType: "basic_auth"
                      chainChecks:
                        chain:
                          type: "chain"
                          payload: '{"method":"eth_chainId","id":1,"jsonrpc":"2.0"}'
                          resultKey: "id"
                          allowance: 0
                          evmChainID: 21
                        sync:
                          type: "sync"
                          payload: '{"id":2,"jsonrpc":"2.0","method":"query_test"}'
                          resultKey: "result.sync_info_test"
                          allowance: 2
                          evmChainID: 0
                      domains:
                        pokt-mainnet:
                          - "mainnet.rpc.grove.city"
                      createdAt: "2024-03-14T18:49:19.47183Z"
                      updatedAt: "2024-03-14T18:49:19.47183Z"
                      deleted: false
                    gigastakeApps:
                      - id: "fa88fcc6"
                        protocolID: "morse-mainnet"
                        chainIDs:
                          "4444": {}
                        name: "swinub"
                        address: "test_7d5f7a4a0c7d9f2cd11c2a563e7e8c6"
                        publicKey: "test_47b1e9527g6049ec98b9b6b308efc3d1"
                        clientPublicKey: "test_75d39g1dd93f419b91b528b1d0783a10"
                        signature: "test_g33762gb677457hcb41c716f6g57f4db"
                        version: "0.0.1"
                        createdAt: "2024-03-14T18:49:19.47183Z"
                        updatedAt: "2024-03-14T18:49:19.47183Z"
                        deleted: false
  /v2/chain/{chainID}:
