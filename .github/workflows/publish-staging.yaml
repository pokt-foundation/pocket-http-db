name: Staging Build, Test publish to AWS ECR and GCP Artifact Registry

on:
  push:
    branches:
      - staging
      - v2-staging

jobs:
  lint_staging:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.18

      - name: Check out code
        uses: actions/checkout@v3

      - name: Run Golang ci Action
        uses: golangci/golangci-lint-action@v3

  test_staging:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.18

      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Set up Docker test stack
        run: make test_env_up

      - name: Run all tests
        run: make run_all_tests

  release_staging:
    needs: [lint_staging, test_staging]
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.semantic.outputs.release-version }}

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-go@v3

      - name: Set up cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Tag
        uses: codfish/semantic-release-action@v2.1.0
        id: semantic
        with:
          branches: |
            [
              'staging',
              {
                name: 'v2-staging',
                prerelease: true
              },
            ]
          tag_format: "v${version}"
          additional_packages: |
            ['@semantic-release/commit-analyzer']
          plugins: |
            ['@semantic-release/commit-analyzer']

  publish_ecr:
    name: Publish Image to AWS ECR
    needs: [lint_staging, test_staging, release_staging]
    runs-on: ubuntu-22.04
    outputs:
      ecr-image-name: ${{ steps.build-image-api.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR (API)
        id: build-image-api
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: postgres-api-staging
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ needs.release_staging.outputs.version }} .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ needs.release_staging.outputs.version }}
          echo "::set-output name=image::$ECR_REGISTRY/$ECR_REPOSITORY:${{ needs.release_staging.outputs.version }}"

  publish_gcp:
    name: Publish Image to GCP Artifact Registry
    needs: [lint_staging, test_staging, release_staging]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Authenticate to Google Cloud
        id: auth_gcp
        uses: 'google-github-actions/auth@v0.6.0'
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
          token_format: 'access_token'
      - name: Login to GAR
        uses: docker/login-action@v2
        with:
          registry: "${{ env.REGISTRY }}"
          username: oauth2accesstoken
          password: ${{ steps.auth_gcp.outputs.access_token }}
      - name: Tag Docker image and push to Google Artifact Registry
        id: docker-push-tagged-v2
        uses: docker/build-push-action@v2
        with:
          build-args: GITHUB_TOKEN=${{ secrets.GH_ACCESS_TOKEN }}
          push: true
          tags: |
              ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ needs.release_staging.outputs.version }}
