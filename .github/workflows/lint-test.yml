name: Lint & Unit Test

on:
  pull_request:
    branches: [master]

jobs:
  golangci-lint:
    name: Run golangci-lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.21

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout 10m --verbose

  gocritic:
    name: Run gocritic
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.21

      - name: Run gocritic
        run: |
          go install github.com/go-critic/go-critic/cmd/gocritic@v0.11.2
          gocritic check -disable=sloppyTypeAssert ./...

  unit-test:
    name: Run unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.21

      - name: Run unit tests
        run: make test_unit_ci

  e2e-test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.21

      - name: Set up Docker test stack
        run: make test_env_up

      - name: Run Postgres Driver tests
        run: make run_driver_tests_ci

      - name: Reset test env
        run: make reset_test_env_ci

      - name: Run E2E tests
        run: make run_e2e_tests_ci

  test-docker-build:
    name: Test build of Docker image
    runs-on: ubuntu-22.04
    steps:
      - uses: docker/build-push-action@v2
        with:
          build-args: |
            IMAGE_TAG=test
            GITHUB_TOKEN=${{ secrets.POKT_BOT_GITHUB_TOKEN }}
          push: false
          load: true
          tags: test-build
