name: Deploy to production ECS us-west-2

on:
  workflow_run:
    workflows:
      ["Production Build, Test publish to AWS ECR and GCP Artifact Registry"]
    branches:
      - master
    workflow_dispatch: {}

jobs:
  deploy_ecr_production:
    name: Deploy AWS ECR production
    runs-on: ubuntu-22.04
    steps:
      - name: Fill in the new image ID / us-west-2 - API
        id: task-def-us-west-2-api
        uses: aws-actions/amazon-ecs-render-task-definition@master
        with:
          task-definition: .aws/ecs-task-definition-production.json
          container-name: postgres-api
          image: ${{ needs.publish_ecr.outputs.ecr-image-name }}
          environment-variables: |
            PG_USER=${{ secrets.PG_USER }}
            PG_PASSWORD=${{ secrets.PG_PASSWORD }}
            PG_HOST=${{ secrets.PG_HOST }}
            PG_PORT=${{ secrets.PG_PORT }}
            PG_DATABASE=${{ secrets.PG_DATABASE }}
            PG_SSL_ROOT_CERT=${{ secrets.PG_SSL_ROOT_CERT }}
            PG_SSL_CERT=${{ secrets.PG_SSL_CERT }}
            PG_SSL_KEY=${{ secrets.PG_SSL_KEY }}
            API_KEYS=${{ secrets.PHD_API_KEYS_PRODUCTION }}
            PORT=${{ secrets.PORT }}
            CACHE_REFRESH=${{ secrets.CACHE_REFRESH }}

      - name: Deploy / us-west-2
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def-us-west-2-api.outputs.task-definition }}
          service: postgres-api
          cluster: postgres-api
          wait-for-service-stability: true
