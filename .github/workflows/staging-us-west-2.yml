name: Staging deployment us-west-2

on:
  push:
    branches:
      - staging

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.18

      - name: Check out code
        uses: actions/checkout@v3

      - name: Run Golang ci Action
        uses: golangci/golangci-lint-action@v3

  test:
    name: Test
    runs-on: ubuntu-18.04
    needs: [lint]

    steps:
      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.18

      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up cache
        uses: actions/cache@v2
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # v0 tests - TODO remove when v0 dropped
      - name: Set up Docker test stack for v0
        run: make test_env_up
      - name: Run all V0 tests
        run: make run_all_tests_v0
      - name: Tear down Docker test stack for v0
        run: make test_env_down

      - name: Set up Docker test stack for v1
        run: make test_env_up
      - name: Run all V1 tests
        run: make run_all_tests_v1

  deploy:
    name: Postgres HTTP API Staging
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR (API)
        id: build-image-api
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: postgres-api-staging
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "::set-output name=image::$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Fill in the new image ID / us-west-2 - API
        id: task-def-us-west-2-api
        uses: aws-actions/amazon-ecs-render-task-definition@master
        with:
          task-definition: .aws/ecs-task-definition-staging.json
          container-name: postgres-api-staging
          image: ${{ steps.build-image-api.outputs.image }}
          environment-variables: |
            PORT=${{ secrets.PORT }}
            CONNECTION_STRING=${{ secrets.CONNECTION_STRING_STAGING }}
            API_KEYS=${{ secrets.API_KEYS }}
            CACHE_REFRESH=${{ secrets.CACHE_REFRESH }}

      - name: Deploy / us-west-2
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def-us-west-2-api.outputs.task-definition }}
          service: postgres-api-staging
          cluster: postgres-api
          wait-for-service-stability: true
