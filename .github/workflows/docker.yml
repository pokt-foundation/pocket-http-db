name: Build and Push Docker Image

on:
  push:
    branches:
      - master
      - v2-staging

env:
  PROJECT_ID: portal-gb-prod
  REPOSITORY: pocket-http-db
  IMAGE: pocket-http-db
  REGISTRY: us-central1-docker.pkg.dev

jobs:
  login-build-push:
    name: Docker login, build, and push
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1

    - id: 'auth'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v0.6.0'
      with:
        credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
        token_format: 'access_token'

    - name: Login to GAR
      uses: docker/login-action@v2
      with:
        registry: "${{ env.REGISTRY }}"
        username: oauth2accesstoken
        password: ${{ steps.auth.outputs.access_token }}

    - name: Get tag v2
      if: startsWith(github.ref, 'refs/heads/v2-staging')
      id: get-tag-v2
      run: echo "dockertag=2.0.0_$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

    - id: docker-push-tagged-v2
      if: startsWith(github.ref, 'refs/heads/v2-staging')
      name: Tag Docker image and push to Google Artifact Registry
      uses: docker/build-push-action@v2
      with:
        build-args: GITHUB_TOKEN=${{ secrets.GH_ACCESS_TOKEN }}
        push: true
        tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ steps.get-tag-v2.outputs.dockertag }}
            
    - name: Get tag
      if: startsWith(github.ref, 'refs/heads/master')
      id: get-tag-v1
      run: echo "dockertag=1.0.0_$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

    - id: docker-push-tagged-v1
      if: startsWith(github.ref, 'refs/heads/master')
      name: Tag Docker image and push to Google Artifact Registry
      uses: docker/build-push-action@v2
      with:
        build-args: GITHUB_TOKEN=${{ secrets.GH_ACCESS_TOKEN }}
        push: true
        tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ steps.get-tag-v1.outputs.dockertag }}
