name: Build and Push Docker Image to Google Artifact Registry

on:
  workflow_run:
    workflows: ["Build & Test"]
    branches: [master, staging, v2-staging]
    types:
      - completed

env:
  PROJECT_ID: portal-gb-prod
  REPOSITORY: pocket-http-db
  IMAGE: pocket-http-db
  REGISTRY: us-central1-docker.pkg.dev

jobs:
  semantic-tag:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Semantic Release Tag
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v3

      - name: Tag Semantic Release Version
        uses: codfish/semantic-release-action@v2
        with:
          branches: |
            [
              'master',
              {
                name: 'v2-staging',
                prerelease: true,
                prereleaseId: 'rc'
              }
            ]
          tag_format: "v${version}"
          additional_packages: |
            ['@semantic-release/commit-analyzer']
          plugins: |
            ['@semantic-release/commit-analyzer']

  login-build-push:
    name: Push Docker Image sto Google Artifact Registry
    runs-on: ubuntu-22.04
    needs: [semantic-tag]
    if: ${{ needs.semantic-tag.outputs.new-release-published == 'true' }}

    steps:
      - uses: actions/checkout@v3

      - uses: docker/setup-buildx-action@v2

      - name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v0.6.0"
        id: auth
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"
          token_format: "access_token"

      - name: Login to GAR
        uses: docker/login-action@v2
        with:
          registry: "${{ env.REGISTRY }}"
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Tag Docker image and push to Google Artifact Registry
        uses: docker/build-push-action@v2
        with:
          build-args: GITHUB_TOKEN=${{ secrets.GH_ACCESS_TOKEN }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ needs.semantic-tag.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest
