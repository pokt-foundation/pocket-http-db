name: Lint, Test, Tag, Push Test Database Image and Push Docker Image to GAR

on:
  push:
    branches: [master, dev]

env:
  PROJECT_ID: portal-gb-prod
  REPOSITORY: portal-http-db
  IMAGE: portal-http-db
  REGISTRY: us-central1-docker.pkg.dev

jobs:
  golangci-lint:
    name: Run golangci-lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.21

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout 10m --verbose

  gocritic:
    name: Run gocritic
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.21

      - name: Run gocritic
        run: |
          go install github.com/go-critic/go-critic/cmd/gocritic@v0.11.2
          gocritic check -disable=sloppyTypeAssert ./...

  unit-test:
    name: Run unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.21

      - name: Run unit tests
        run: make test_unit_ci

  e2e-test:
    name: Run End-to-End tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.21

      - name: Set up Docker test stack
        run: make test_env_up

      - name: Run Postgres Driver tests
        run: make run_driver_tests_ci

      - name: Reset test env
        run: make reset_test_env_ci

      - name: Run E2E tests
        run: make run_e2e_tests_ci

  test-docker-build:
    name: Test build of Docker image
    runs-on: ubuntu-22.04
    steps:
      - uses: docker/build-push-action@v2
        with:
          build-args: |
            IMAGE_TAG=test
            GITHUB_TOKEN=${{ secrets.POKT_BOT_GITHUB_TOKEN }}
          push: false
          load: true
          tags: test-build

  tag:
    name: Semantic Release Tag
    runs-on: ubuntu-22.04
    needs: [golangci-lint, gocritic, unit-test, e2e-test, test-docker-build]
    outputs:
      new: ${{ steps.semantic.outputs.new-release-published }}
      version: ${{ steps.semantic.outputs.release-version }}

    steps:
      - uses: actions/checkout@v3

      - name: Tag Semantic Release Version
        id: semantic
        uses: codfish/semantic-release-action@v3
        with:
          branches: |
            [
              'master',
              {
                name: 'dev',
                prerelease: 'dev'
              }
            ]
          tag-format: "v${version}"
          additional-packages: |
            ['@semantic-release/commit-analyzer']
          plugins: |
            ['@semantic-release/commit-analyzer']

  publish-test-db:
    if: needs.tag.outputs.new == 'true'
    name: Push Test Database Image to Dockerhub
    runs-on: ubuntu-22.04
    needs: [golangci-lint, gocritic, unit-test, e2e-test, test-docker-build, tag]

    steps:
      - uses: actions/checkout@v3

      - uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Test Database Docker image and push to Dockerhub
        uses: docker/build-push-action@v3
        with:
          push: true
          context: .
          file: ./Dockerfile.testdb
          tags: |
            pocketfoundation/test-portal-postgres:latest
            pocketfoundation/test-portal-postgres:${{ needs.tag.outputs.version }}

  push:
    if: needs.tag.outputs.new == 'true'
    name: Push Docker Image to Google Artifact Registry
    runs-on: ubuntu-22.04
    needs: [golangci-lint, gocritic, unit-test, e2e-test, test-docker-build, tag]

    steps:
      - uses: actions/checkout@v3

      - uses: docker/setup-buildx-action@v2

      - name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v0.6.0"
        id: auth
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"
          token_format: "access_token"

      - name: Login to GAR
        uses: docker/login-action@v2
        with:
          registry: "${{ env.REGISTRY }}"
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Tag Docker image and push to Google Artifact Registry
        uses: docker/build-push-action@v4
        with:
          push: true
          context: .
          file: ./Dockerfile
          build-args: |
            IMAGE_TAG=${{ needs.tag.outputs.version }}
            GITHUB_TOKEN=${{ secrets.GH_ACCESS_TOKEN }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ needs.tag.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest
