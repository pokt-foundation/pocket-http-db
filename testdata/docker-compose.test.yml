# This Docker compose only used for E2E testing the Pocket HTTP DB
version: "3"

services:
  pocket-http-db-1:
    build:
      context: ..
    container_name: pocket-http-db-1
    restart: always
    ports:
      - 8080:8080
    environment:
      PG_USER: postgres
      PG_PASSWORD: pgpassword
      PG_HOST: portal-db
      PG_PORT: 5432
      PG_DATABASE: postgres
      API_KEYS: test_api_key_6789
      APP_ENV: test
    depends_on:
      portal-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5

  pocket-http-db-2:
    build:
      context: ..
    container_name: pocket-http-db-2
    restart: always
    ports:
      - 8081:8080
    environment:
      PG_USER: postgres
      PG_PASSWORD: pgpassword
      PG_HOST: portal-db
      PG_PORT: 5432
      PG_DATABASE: postgres
      API_KEYS: test_api_key_6789
      APP_ENV: test
    depends_on:
      portal-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5

  portal-db:
    image: pocketfoundation/test-portal-postgres:latest
    container_name: portal-db
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: pgpassword
      POSTGRES_DB: postgres
    healthcheck:
      test: pg_isready -U postgres
